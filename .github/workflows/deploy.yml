name: Deploy to Cloudflare Pages (tta-dazzle)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tta-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files (exclude repo meta)
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='wear' \
            --exclude='clothing' \
            --exclude='_deploy' \
            ./ _deploy/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2e3840298d01bbfc3bad649f37ce39e5
        run: npx -y wrangler@latest pages deploy _deploy --project-name=tta-dazzle --branch=main
