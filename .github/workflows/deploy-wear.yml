name: Deploy TTA Wear to Cloudflare Pages (tta-wear)

# TTA Wear is a separate site from the print studio. This publishes ONLY the
# wear/ folder to its own Pages project (tta-wear). It never deploys to
# tta-dazzle, so thetalkingarts.com is not affected by anything here.
on:
  push:
    branches: [main, claude/inspiring-archimedes-pp6kg5]
    paths:
      - 'wear/**'
      - '.github/workflows/deploy-wear.yml'
  workflow_dispatch:

concurrency:
  group: tta-wear-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2e3840298d01bbfc3bad649f37ce39e5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the tta-wear project on first run
        run: npx -y wrangler@latest pages project create tta-wear --production-branch=main || echo "Project already exists, or could not be created (the deploy step will say why)."

      - name: Deploy wear/ to Cloudflare Pages
        run: npx -y wrangler@latest pages deploy wear --project-name=tta-wear --branch=main --commit-dirty=true
